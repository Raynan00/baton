name: ci-server
on:
  push: { branches: [main], paths: ["server/**"] }
  pull_request: { paths: ["server/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  relay-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - name: Start local Worker
        working-directory: server
        run: |
          npx wrangler dev --port 8787 --log-level warn > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/healthz && break; sleep 1; done
      - run: cargo test -p baton-cli --test relay_e2e
        env: { BATON_RELAY_URL: "http://localhost:8787" }
      - name: Worker logs hold no plaintext
        run: "! grep -E 'secret.example|Secret Title' server/wrangler.log"
