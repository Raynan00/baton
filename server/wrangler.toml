name = "batonsync-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "dev"
MODE = "full"

[env.dev.vars]
ENV = "dev"
MODE = "full"

[env.prod.vars]
