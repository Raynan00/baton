name = "batonsync-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "dev"
MODE = "full"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceDO"]

[env.dev.vars]
ENV = "dev"
MODE = "full"

[env.prod.vars]
ENV = "prod"
MODE = "full"
# Secrets (never in this file): APNS_KEY_P8, APNS_KEY_ID, APNS_TEAM_ID, APNS_TOPIC
# RendezvousDO, the R2 bucket (batonsync-blobs) and per-env DO bindings follow in later PRs.
