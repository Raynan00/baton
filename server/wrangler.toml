name = "batonsync-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "dev"
MODE = "full"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceDO"

[[durable_objects.bindings]]
name = "RENDEZVOUS"
class_name = "RendezvousDO"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "batonsync-blobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RendezvousDO"]

[env.dev.vars]
ENV = "dev"
MODE = "full"

[env.prod.vars]
ENV = "prod"
MODE = "full"
# Secrets (never in this file): APNS_KEY_P8, APNS_KEY_ID, APNS_TEAM_ID, APNS_TOPIC
# R2 bucket needs a 1-day lifecycle rule (see PROGRESS.md: Blocked).
