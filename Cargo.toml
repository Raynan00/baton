[workspace]
resolver = "2"
members = ["crates/baton-core", "crates/baton-ffi", "crates/baton-platform", "crates/baton-nmhost", "crates/baton-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
baton-core = { path = "crates/baton-core" }
prost = "0.13"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
